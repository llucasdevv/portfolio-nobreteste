<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOBRE | Produtos e Ofertas</title>

    <meta
        name="description"
        content="Conheça nossos produtos, novidades e ofertas."
    >

    <meta name="theme-color" content="#000000">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --black: #050505;
            --black-soft: #0d0d0d;
            --dark: #151515;
            --gray-dark: #222222;
            --gray: #777777;
            --gray-light: #bdbdbd;
            --border: #292929;
            --white: #ffffff;
            --off-white: #f5f5f5;

            --container: 1200px;
            --radius: 16px;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: "DM Sans", sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body.modal-open {
            overflow: hidden;
        }

        body.cart-open {
            overflow: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(100% - 40px, var(--container));
            margin-inline: auto;
        }

        .section {
            padding: 110px 0;
        }

        .section-header {
            margin-bottom: 48px;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 14px;
            color: var(--gray-light);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .section-title {
            font-family: "Playfair Display", serif;
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: -0.03em;
        }

        .section-description {
            max-width: 600px;
            margin-top: 18px;
            color: var(--gray-light);
            font-size: 1rem;
        }

        /* =========================================================
            HEADER
        ========================================================== */

        .header {
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            border-bottom: 1px solid transparent;
            background: rgba(5, 5, 5, 0);
            transition: var(--transition);
        }

        .header.scrolled {
            border-color: var(--border);
            background: rgba(5, 5, 5, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .nav {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        /* =========================================================
            LOGO PNG
        ========================================================== */

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex-shrink: 0;
        }

        .logo img {
            width: auto;
            height: 138px;
            max-width: 570px;
            object-fit: contain;
        }

        .logo-name {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: var(--gray-light);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--white);
        }

        .nav-cta {
            padding: 10px 18px;
            border: 1px solid var(--white);
            color: var(--white) !important;
        }

        .nav-cta:hover {
            background: var(--white);
            color: var(--black) !important;
        }

        .menu-toggle {
            display: none;
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--white);
        }

        .menu-toggle span {
            display: block;
            width: 18px;
            height: 1px;
            margin: 4px auto;
            background: var(--white);
            transition: var(--transition);
        }

        /* =========================================================
            BOTÃO DO CARRINHO
        ========================================================== */

         .cart-button {
             display: flex;
             align-items: center;
             gap: 8px;
             padding: 8px 12px;
             border: none;
             background: transparent;
             color: var(--white);
             font-size: 0.78rem;
             font-weight: 700;
             cursor: pointer;
         }

         .cart-button img {
             width: 72px;
             height: 72px;
             object-fit: contain;
             transition: transform 0.2s ease;
         }

         .cart-button:hover img {
             transform: scale(1.08);
         }

         .cart-button strong {
             min-width: 20px;
             height: 20px;
             display: flex;
             align-items: center;
             justify-content: center;
             border-radius: 50%;
             background: var(--white);
             color: var(--black);
             font-size: 0.65rem;
         }

         @media (max-width: 800px) {
            .cart-button span {
                display: none;
            }

            .cart-button {
                padding: 8px;
            }
         }

        /* =========================================================
            FUNDO DO CARRINHO
        ========================================================== */
         
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 9998;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
         }

        .cart-overlay.active {
            opacity: 1;
            visibility: visible;
         }

        /* =========================================================
            PAINEL DO CARRINHO
        ========================================================== */
         .cart-panel {
             position: fixed;
             top: 0;
             right: 0;

             width: min(450px, 100%);
             height: 100vh;

             background: #0b0b0b;
             border-left: 1px solid var(--border);

             z-index: 9999;

             display: flex;
             flex-direction: column;

             transform: translateX(100%);
             transition: transform 0.3s ease;
         }

          .cart-panel.active {
             transform: translateX(0);
         }

        /* =========================================================
            CABEÇALHO DO CARRINHO
        ========================================================== */
          .cart-header {
              display: flex;
              align-items: center;
              justify-content: space-between;

              padding: 24px;
              border-bottom: 1px solid var(--border);
           }

           .cart-header h2 {
               margin: 0;
               font-family: "Playfair Display", serif;
               font-size: 1.6rem;
           }

            .cart-close {
                width: 38px;
                height: 38px;

                border: 1px solid var(--border);
                background: transparent;
                color: var(--white);

                font-size: 1.4rem;
                cursor: pointer;
            }

             .cart-close:hover {
                 background: var(--white);
                 color: var(--black);
            }

        /* =========================================================
            PRODUTOS DO CARRINHO
        ========================================================== */

            .cart-items {
                flex: 1;
                overflow-y: auto;
                padding: 20px;
            }

            .cart-item {
                display: grid;
                grid-template-columns: 75px 1fr auto;
                gap: 14px;

                padding: 16px 0;
                border-bottom: 1px solid var(--border);
             }

            .cart-item-image {
                width: 75px;
                height: 90px;
                overflow: hidden;
                background: #151515;
             }

            .cart-item-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
             }

            .cart-item-info h3 {
                margin: 0 0 6px;
                font-size: 0.9rem;
             }

            .cart-item-price {
                color: var(--gray-light);
                font-size: 0.8rem;
             }

        /* =========================================================
            QUANTIDADE
        ========================================================== */

            .cart-quantity {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 12px;
             }

            .cart-quantity button {
                width: 28px;
                height: 28px;

                border: 1px solid var(--border);
                background: transparent;
                color: var(--white);

                cursor: pointer;
             }

            .cart-quantity button:hover {
                background: var(--white);
                color: var(--black);
             }

            .cart-quantity span {
                min-width: 20px;
                text-align: center;
                font-size: 0.8rem;
             }

        /* =========================================================
            REMOVER
        ========================================================== */

           .cart-remove {
               border: 0;
               background: transparent;
               color: #888;

               font-size: 0.75rem;
               cursor: pointer;
              }

           .cart-remove:hover {
               color: var(--white);
              }

           .cart-item-info {
               min-width: 0;
           }

           .cart-item-info h3 {
               overflow-wrap: anywhere;
           }

           .cart-whatsapp:disabled {
               opacity: 0.45;
               cursor: not-allowed;
           }

        /* =========================================================
            CARRINHO VAZIO
        ========================================================== */

           .cart-empty {
               padding: 70px 20px;
               text-align: center;
               color: var(--gray-light);
            }

        /* =========================================================
            RODAPÉ
        ========================================================== */

           .cart-footer {
               padding: 20px;
               border-top: 1px solid var(--border);
            }

           .cart-total {
               display: flex;
               align-items: center;
               justify-content: space-between;

               margin-bottom: 18px;
               font-size: 1rem;
            }

           .cart-total strong {
               font-size: 1.3rem;
            }

          .cart-whatsapp {
              width: 100%;
              min-height: 50px;

              border: 1px solid var(--white);
              background: var(--white);
              color: var(--black);

              font-weight: 700;
              cursor: pointer;

              transition: var(--transition);
            }

           .cart-whatsapp:hover {
               background: transparent;
               color: var(--white);
            }

        /* =========================================================
            MOBILE
        ========================================================== */

        @media (max-width: 768px) {
            .cart-panel {
                width: 100%
            }
        }

        /* =========================================================
            HERO
        ========================================================== */

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 10%;
            right: -180px;
            width: 500px;
            height: 500px;
            border: 1px solid #222;
            border-radius: 50%;
            box-shadow:
                0 0 0 80px rgba(255,255,255,0.015),
                0 0 0 160px rgba(255,255,255,0.01);
        }

        .hero::after {
            content: "";
            position: absolute;
            bottom: -200px;
            left: -200px;
            width: 500px;
            height: 500px;
            border: 1px solid #1b1b1b;
            border-radius: 50%;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 850px;
            padding: 140px 0 100px;
        }

        .hero-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            color: var(--gray-light);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .hero-label::before {
            content: "";
            width: 28px;
            height: 1px;
            background: var(--white);
        }

        .hero-title {
            max-width: 900px;
            font-family: "Playfair Display", serif;
            font-size: clamp(3.4rem, 8vw, 7rem);
            font-weight: 600;
            line-height: 0.94;
            letter-spacing: -0.055em;
        }

        .hero-title span {
            color: var(--gray);
        }

        .hero-description {
            max-width: 620px;
            margin-top: 30px;
            color: var(--gray-light);
            font-size: clamp(1rem, 2vw, 1.15rem);
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 38px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 50px;
            padding: 0 24px;
            border: 1px solid var(--white);
            background: var(--white);
            color: var(--black);
            font-size: 0.85rem;
            font-weight: 700;
            transition: var(--transition);
        }

        .btn:hover {
            background: transparent;
            color: var(--white);
        }

        .btn-outline {
            background: transparent;
            color: var(--white);
            border-color: var(--border);
        }

        .btn-outline:hover {
            border-color: var(--white);
            background: var(--white);
            color: var(--black);
        }

        /* =========================================================
            PROMO BANNER
        ========================================================== */

        .promo-strip {
            border-bottom: 1px solid var(--border);
            background: var(--white);
            color: var(--black);
        }

        .promo-strip-inner {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
        }

        .promo-strip strong {
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .promo-strip span {
            color: #555;
            font-size: 0.8rem;
        }

        /* =========================================================
            PRODUTOS
        ========================================================== */

        .products-section {
            background: var(--black-soft);
        }

        .shop-toolbar {
            position: relative;
            z-index: 1000;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 35px;
        }

        .search {
            position: relative;
            flex: 1;
            max-width: 380px;
        }

        .search svg {
            position: absolute;
            top: 50%;
            left: 16px;
            width: 18px;
            height: 18px;
            color: var(--gray);
            transform: translateY(-50%);
        }

        .search input {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 48px;
            border: 1px solid var(--border);
            outline: none;
            background: var(--black);
            color: var(--white);
            transition: var(--transition);
        }

        .search input::placeholder {
            color: #666;
        }

        .search input:focus {
            border-color: #666;
        }

        .filters {
            position: relative;
            z-index: 1001;
            overflow: visible;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            min-height: 42px;
            padding: 0 15px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--gray-light);
            font-size: 0.8rem;
            transition: var(--transition);
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--white);
            background: var(--white);
            color: var(--black);
        }

        /* =========================================================
            SUBMENU DOS FILTROS
        ========================================================== */

        .filter-group {
            position: relative;
        }

        .filter-group > .filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group.has-submenu > .filter-btn::after {
            content: "⌄";
            font-size: 0.75rem;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .filter-group.has-submenu:hover > .filter-btn::after,
        .filter-group.has-submenu.open > .filter-btn::after {
            transform: rotate(180deg);
        }

        .filter-submenu {
            position: absolute;
            z-index: 100;
            top: calc(100% + 6px);
            left: 0;
            min-width: 230px;
            padding: 7px;
            border: 1px solid var(--border);
            background: #101010;
            box-shadow: 0 18px 45px rgba(0,0,0,0.45);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-5px);
            transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
        }

        .filter-group:hover .filter-submenu,
        .filter-group.open .filter-submenu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .filter-submenu button {
            display: block;
            width: 100%;
            padding: 11px 13px;
            border: 0;
            background: transparent;
            color: var(--gray-light);
            text-align: left;
            font-size: 0.78rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-submenu button:hover,
        .filter-submenu button.active {
            background: var(--white);
            color: var(--black);
        }

        @media (max-width: 520px) {
            .filter-group {
                position: relative;
                flex-shrink: 0;
            }

            /* Correção aplicada: agora abre logo abaixo do botão no celular, sem ir para o topo da tela */
            .filter-submenu {
                position: absolute;
                z-index: 5000;
                top: calc(100% + 6px);
                left: 0;
                right: auto;
                min-width: 250px;
                max-width: calc(100vw - 28px);
                max-height: min(60vh, 420px);
                overflow-y: auto;
                padding: 8px;
                border-radius: 10px;
                box-shadow: 0 18px 45px rgba(0,0,0,0.6);
                -webkit-overflow-scrolling: touch;
            }

            .filter-submenu button {
                min-height: 48px;
                padding: 13px 15px;
                font-size: 0.92rem;
                line-height: 1.25;
                border-radius: 6px;
            }

            .filter-btn {
                min-height: 46px;
                padding: 0 16px;
                font-size: 0.86rem;
                touch-action: manipulation;
            }
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        /* CARROSSEL DE DESTAQUES */
        .products-carousel {
            position: relative;
            width: 100%;
        }

        .products-carousel .products-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            overflow: hidden;
            scroll-behavior: smooth;
        }

        .products-carousel.is-active .products-grid {
            display: flex;
        }

        .products-carousel.is-active .product-card {
            flex: 0 0 calc((100% - 54px) / 4);
            min-width: 0;
        }

        .products-carousel.is-active .product-image {
            aspect-ratio: 4 / 4.6;
        }

        .products-carousel.is-active .product-content {
            padding: 16px;
        }

        .products-carousel.is-active .product-name {
            font-size: 1.15rem;
        }

        .products-carousel.is-active .product-caption {
            min-height: 38px;
            font-size: 0.78rem;
        }

        .products-carousel.is-active .product-price {
            margin-top: 12px;
        }

        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255,255,255,.28);
            border-radius: 50%;
            background: rgba(10,10,10,.88);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,.35);
            transition: .25s ease;
        }

        .carousel-prev { left: 10px; }
        .carousel-next { right: 10px; }

        .products-carousel:not(.is-active) .carousel-arrow {
            display: none;
        }

        .carousel-arrow:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: translateY(-50%) scale(1.06);
        }

        .carousel-arrow:disabled {
            opacity: 0;
            pointer-events: none;
        }

        .product-card {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #0a0a0a;
            transition:
                transform var(--transition),
                border-color var(--transition),
                box-shadow var(--transition);
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: #555;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .product-image {
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            background:
                linear-gradient(135deg, #222 0%, #080808 55%, #171717 100%);
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.04);
        }

        .image-placeholder {
            height: 100%;
            display: grid;
            place-items: center;
            padding: 20px;
            color: #555;
            font-family: "Playfair Display", serif;
            font-size: 1.4rem;
            text-align: center;
        }

        .sale-badge {
            position: absolute;
            z-index: 2;
            top: 12px;
            left: 12px;
            padding: 6px 10px;
            background: var(--white);
            color: var(--black);
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .product-content {
            padding: 20px;
        }

        .product-category {
            margin-bottom: 8px;
            color: #777;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .product-name {
            font-family: "Playfair Display", serif;
            font-size: 1.4rem;
            line-height: 1.15;
        }

        .product-caption {
            min-height: 46px;
            margin-top: 8px;
            color: var(--gray);
            font-size: 0.82rem;
        }

        .product-price {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 18px;
        }

        .old-price {
            color: #666;
            font-size: 0.8rem;
            text-decoration: line-through;
        }

        .current-price {
            color: var(--white);
            font-size: 1.15rem;
            font-weight: 700;
        }

        .discount {
            color: var(--gray-light);
            font-size: 0.7rem;
            font-weight: 700;
        }

        .product-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 20px;
        }

        .product-btn {
            min-height: 42px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--white);
            font-size: 0.72rem;
            font-weight: 700;
            transition: var(--transition);
        }

        .product-btn:hover {
            border-color: var(--white);
            background: var(--white);
            color: var(--black);
        }

        .product-btn.buy {
            display: flex;
            align-items: center;
            justify-content: center;
            border-color: var(--white);
            background: var(--white);
